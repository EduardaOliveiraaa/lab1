name: CD - Entrega Contínua Docker

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    name: Build e Push para Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 1. Fazer checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 4. Extrair metadados (tag da imagem)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: Dudenha/kanban-api

      - name: 5. Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}